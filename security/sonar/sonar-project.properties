# SonarQube Project Configuration
sonar.projectKey=devsecops-gitops-mega-project
sonar.projectName=DevSecOps Task Manager
sonar.projectVersion=1.0

# Path to sources
sonar.sources=application/backend/src,application/frontend/src
sonar.exclusions=**/node_modules/**,**/build/**,**/dist/**,**/*.test.js

# Encoding of source files
sonar.sourceEncoding=UTF-8

# Language
sonar.language=js
